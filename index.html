async function autoMove(){const k=forcedToken();if(k===null||busy)return;const game=s,turn=s.turn;busy=true;render();$('turnTitle').textContent=`${s.players[s.turn].name} rolled ${s.die}`;$('status').textContent='Moving automatically…';await new Promise(r=>setTimeout(r,450));busy=false;if(s===game&&s.turn===turn&&s.phase==='move')await move(k);else render()}

async function tumbleDice(result){

  dice.classList.add('rolling');

  for(const n of [2,5,3,1,6,4,2,5]){face(n);await pause(90)}

}
async function animateSteps(pi,k,destination){
 const p=s.players[pi],start=p.tokens[k],path=start===-1?[0]:Array.from({length:destination-start},(_,i)=>start+i+1);
 try{
  for(const pos of path){
   const old=$(`token-${pi}-${k}`),from=[Number(old.getAttribute('data-x')),Number(old.getAttribute('data-y'))];
   moving={pi,k,pos};draw();
   const token=$(`token-${pi}-${k}`),to=[Number(token.getAttribute('data-x')),Number(token.getAttribute('data-y'))];
   $('board').append(token);
   if(!reducedMotion()&&typeof token.animate==='function'){
    const dx=from[0]-to[0],dy=from[1]-to[1];

     {transform:'translate(0px, 0px)'}

}
async function roll(event){

}
async function move(k){if(busy||!s||s.phase!=='move'||!legal(k))return;const p=s.players[s.turn],destination=p.tokens[k]===-1?0:p.tokens[k]+s.die;busy=true;render();$('status').textContent=`Token ${k+1}`;try{await animateSteps(s.turn,k,destination)}catch{moving=null}p.tokens[k]=destination;busy=false;let captured=0;const v=p.tokens[k];if(v<ring()-1&&!safe(absolute(p,v)))s.players.forEach((other,i)=>{if(i!==s.turn)other.tokens.forEach((ov,j)=>{if(ov>=0&&ov<ring()-1&&absolute(other,ov)===absolute(p,v)){other.tokens[j]=-1;captured++}})});beep();const home=v===finish();if(p.tokens.every(v=>v===finish())){s.phase='won';s.message='All four tokens are home. Well played!';$('winnerName').textContent=p.name+' wins!';$('winner').showModal()}else if(s.die===6||captured||home){s.phase='roll';s.message=captured?'Captured! Take another roll.':home?'Token home! Roll again.':'Six! Roll again.'}else{next();s.message='Pass the phone.'}save();render()}
function edit(){
 const wrap=$('editors');wrap.replaceChildren();

  const row=document.createElement('div');row.className='editor';row.style.setProperty('--pc',draft[i].color);
  const head=document.createElement('div');head.className='editor-head';
  const number=document.createElement('span');number.className='player-number';number.textContent=i+1;
  const name=document.createElement('input');name.type='text';name.maxLength=18;name.value=draft[i].name;name.setAttribute('aria-label',`Player ${i+1} name`);name.oninput=()=>draft[i].name=name.value;
  const toggle=document.createElement('button');toggle.className='color-toggle';toggle.style.background=draft[i].color;toggle.style.color=contrast(draft[i].color);toggle.textContent=expandedColor===i?'−':'+';toggle.setAttribute('aria-label',`Choose ${draft[i].name}'s color`);toggle.setAttribute('aria-expanded',expandedColor===i);toggle.onclick=()=>{expandedColor=expandedColor===i?-1:i;edit()};head.append(number,name,toggle);row.append(head);

   colorChoices.forEach(([label,color])=>{const button=document.createElement('button');const taken=draft.slice(0,count).some((p,j)=>j!==i&&p.color===color),selected=draft[i].color===color;button.className='swatch';button.style.setProperty('--swatch',color);button.style.setProperty('--on-swatch',contrast(color));button.disabled=taken;button.setAttribute('aria-label',label+(taken?' (in use)':''));button.setAttribute('aria-pressed',selected);const dot=document.createElement('span');dot.textContent=selected?'✓':taken?'−':'';const text=document.createElement('small');text.textContent=label;button.append(dot,text);button.onclick=()=>{draft[i].color=color;edit()};colors.append(button)});row.append(colors)
  }
  wrap.append(row);
 }
 $('count').replaceChildren();for(let n=2;n<=5;n++){const b=document.createElement('button');b.textContent=n;b.className=n===count?'selected':'';b.setAttribute('aria-pressed',n===count);b.onclick=()=>{const used=new Set();for(let i=0;i<n;i++){if(used.has(draft[i].color))draft[i].color=colorChoices.find(([,color])=>!used.has(color))[1];used.add(draft[i].color)}count=n;if(expandedColor>=n)expandedColor=0;edit()};$('count').append(b)}$('variantNote').textContent=count===5?'Custom five-player board.':'';$('error').textContent='';
}
function setup(){edit();$('setup').showModal()}$('start').onclick=()=>{if(busy)return;const chosen=draft.slice(0,count);if(new Set(chosen.map(p=>p.color.toLowerCase())).size!==count){$('error').textContent='Pick a different color for each player.';return}s={version:1,players:chosen.map((p,i)=>({name:p.name.trim()||`Player ${i+1}`,color:p.color,slot:slots(count)[i],tokens:[-1,-1,-1,-1]})),turn:0,phase:'roll',die:0,sixes:0,history:[],message:'Roll a six to start.'};save();$('setup').close();render()};$('action').onclick=e=>{if(!s||s.phase==='won')setup();else roll(e)};$('dice').onclick=roll;$('newGame').onclick=()=>{if(!busy)setup()};$('rematch').onclick=()=>{$('winner').close();setup()};$('help').onclick=()=>$('rules').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'Sound on':'Sound off';beep()};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1&&Array.isArray(v.players)&&v.players.length>=2&&v.players.length<=5&&Number.isInteger(v.turn)&&v.turn>=0&&v.turn<v.players.length&&['roll','move','won'].includes(v.phase)&&Number.isInteger(v.die)&&v.die>=0&&v.die<=6&&Number.isInteger(v.sixes)&&v.sixes>=0&&v.sixes<3&&Array.isArray(v.history)&&v.history.every(n=>Number.isInteger(n)&&n>=1&&n<=6)&&typeof v.message==='string'&&v.players.every((p,i)=>typeof p.name==='string'&&/^#[0-9a-f]{6}$/i.test(p.color)&&p.slot===slots(v.players.length)[i]&&Array.isArray(p.tokens)&&p.tokens.length===4&&p.tokens.every(t=>Number.isInteger(t)&&t>=-1&&t<=(v.players.length===5?69:56))))s=v}catch{}render();autoMove();
